name: Python Tests & Lint

on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y sqlite3

      - name: Install Runtime and Test Dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          # Install AstrBot so backend tests can import it
          pip install git+https://github.com/win119/astrbot.git
          # Install optional dependencies that tests might check
          pip install sentence-transformers scikit-learn ruff

      - name: Run Ruff Lint
        run: |
          ruff check .

      - name: Run Pytest
        run: |
          python -m pytest
